<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello from Ayham Chaban — Cat Typing Animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /*
    Standalone 800x800 "typing cat" animation.
    Reusable pieces, in case this cat or the typing style gets reused elsewhere:
      - Colors:  --ink (background), --gold (cat/border), --cream (text)
      - Cat:     #cat <svg> — body/ears/tail as simple flat shapes
      - Type fx: TYPING_TEXT + the typewriter loop in <script> at the bottom
  */
  :root {
    --ink: #14120F;
    --gold: #B8902F;
    --cream: #F5F1E8;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a08; /* page backdrop behind the canvas, for previewing */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The 800x800 canvas box */
  .canvas {
    position: relative;
    width: 800px;
    height: 800px;
    background: var(--ink);
    border: 1px solid rgba(184, 144, 47, 0.25); /* thin, subtle, warm gold */
    box-sizing: border-box;
    overflow: hidden;
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  }

  /* Typing text, centered above the cat */
  .type-wrap {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
    padding: 0 40px;
    box-sizing: border-box;
  }

  .type-text {
    display: inline-block;
    font-size: 34px;
    letter-spacing: 0.5px;
    color: var(--cream);
    white-space: nowrap;
  }

  .cursor {
    display: inline-block;
    margin-left: 2px;
    color: var(--cream);
    animation: blink 0.9s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Cat sits in the lower third of the box */
  .cat-stage {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 220px;
  }

  #cat {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Bounce/hop applied to the whole cat group */
  #cat-body-group {
    animation: cat-hop 1.1s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  @keyframes cat-hop {
    0%, 100% { transform: translateY(0) scaleY(1); }
    30%      { transform: translateY(-14px) scaleY(1.03); }
    50%      { transform: translateY(0) scaleY(0.97); }
    65%      { transform: translateY(-4px) scaleY(1.01); }
    100%     { transform: translateY(0) scaleY(1); }
  }

  /* Tail sways independently of the hop for extra character */
  #cat-tail {
    animation: tail-sway 1.6s ease-in-out infinite;
    transform-origin: 160px 148px; /* base of the tail, where it meets the body */
  }

  @keyframes tail-sway {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(10deg); }
    50%      { transform: rotate(-6deg); }
    75%      { transform: rotate(8deg); }
  }

  /* Reduced motion: freeze everything to a calm standing pose */
  @media (prefers-reduced-motion: reduce) {
    #cat-body-group,
    #cat-tail {
      animation: none !important;
    }
    .cursor {
      animation: none !important;
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="type-wrap">
    <span class="type-text" id="typeText"></span><span class="cursor" id="cursor">|</span>
  </div>

  <div class="cat-stage">
    <!--
      Original geometric "low-poly" line-art cat, built from simple flat
      polygons only (faceted body/head, angular ears, segmented antenna-
      style tail with joint nodes, square LED eyes). No reference to any
      existing brand/logo.
    -->
    <svg id="cat" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <g id="cat-body-group" fill="#B8902F">

        <!-- tail: drawn first so it sits behind the body. Segmented,
             robot-antenna style — straight links with small joint nodes
             instead of one smooth curve. -->
        <g id="cat-tail">
          <polyline points="160,148 192,138 210,108 196,86"
                     fill="none" stroke="#B8902F" stroke-width="9"
                     stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="192" cy="138" r="5" fill="#14120F" stroke="#B8902F" stroke-width="2.5" />
          <circle cx="210" cy="108" r="5" fill="#14120F" stroke="#B8902F" stroke-width="2.5" />
          <circle cx="196" cy="86" r="5" fill="#B8902F" />
        </g>

        <!-- body: low-poly hexagon -->
        <polygon points="48,152 66,126 148,122 162,152 142,180 66,182" />
        <!-- facet lines, radiating from a central point for a faceted/3D-render look -->
        <g stroke="#14120F" stroke-width="1.5" opacity="0.5">
          <line x1="66" y1="126" x2="105" y2="152" />
          <line x1="148" y1="122" x2="105" y2="152" />
          <line x1="66" y1="182" x2="105" y2="152" />
          <line x1="142" y1="180" x2="105" y2="152" />
        </g>

        <!-- head: low-poly hexagon -->
        <polygon points="55,80 85,96 83,130 55,144 27,130 25,96" />
        <g stroke="#14120F" stroke-width="1.5" opacity="0.5">
          <line x1="55" y1="80" x2="55" y2="144" />
          <line x1="25" y1="96" x2="83" y2="130" />
        </g>

        <!-- ears: sharp angular triangles -->
        <polygon points="32,90 20,50 54,82" />
        <polygon points="80,90 94,48 60,80" />

        <!-- front legs: blocky rectangles (no rounding, for a more built/mechanical look) -->
        <rect x="68" y="176" width="14" height="24" />
        <rect x="98" y="178" width="14" height="26" />

        <!-- face: small square "LED" eyes instead of round dots -->
        <rect x="42" y="104" width="6" height="6" fill="#14120F" />
        <rect x="63" y="104" width="6" height="6" fill="#14120F" />
      </g>
    </svg>
  </div>

</div>

<script>
  /*
    Typewriter loop:
    type the full string char-by-char -> pause ~1.5s -> erase char-by-char
    -> brief pause -> repeat. Disabled (static text, no cursor blink) when
    the user prefers reduced motion.
  */
  var TYPING_TEXT = "Hello from Ayham Chaban";

  var textEl = document.getElementById('typeText');
  var cursorEl = document.getElementById('cursor');

  var prefersReducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  if (prefersReducedMotion) {
    // Static text, no animation, cursor still shown but not blinking.
    textEl.textContent = TYPING_TEXT;
  } else {
    var TYPE_SPEED = 80;     // ms per character while typing
    var ERASE_SPEED = 45;    // ms per character while erasing
    var HOLD_FULL = 1500;    // pause once fully typed
    var HOLD_EMPTY = 500;    // pause once fully erased

    var charIndex = 0;

    function typeLoop() {
      if (charIndex <= TYPING_TEXT.length) {
        textEl.textContent = TYPING_TEXT.slice(0, charIndex);
        charIndex++;
        setTimeout(typeLoop, TYPE_SPEED);
      } else {
        setTimeout(eraseLoop, HOLD_FULL);
      }
    }

    function eraseLoop() {
      if (charIndex > 0) {
        charIndex--;
        textEl.textContent = TYPING_TEXT.slice(0, charIndex);
        setTimeout(eraseLoop, ERASE_SPEED);
      } else {
        setTimeout(typeLoop, HOLD_EMPTY);
      }
    }

    typeLoop();
  }
</script>

</body>
</html>
